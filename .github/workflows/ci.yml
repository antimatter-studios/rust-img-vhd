name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout rust-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      # ONE CHECKOUT OF CORE, WHICH IS BOTH PINS AT ONCE NOW.
      #
      # It was two, for two reasons that wanted different versions. The PATH
      # DEPENDENCY needed at least v0.2.12, the first core with
      # `BlockDevice::set_len` that an allocation calls before writing past
      # the device's end (#99). The TOOLING needed at least v0.2.13, because
      # ../rust-fs-core/scripts/tier.sh resolves core's ../rust-fs-core/scripts/output-budget.sh
      # (rust-fs-core#153 — deliberately not committed here) and v0.2.13 is
      # where a failing tier stopped reading its log aloud.
      #
      # The dependency is on v0.2.14 now, so the lower bound is met by the
      # higher pin and the second checkout has nothing left to do. The
      # comment it carried said exactly this would happen.
      - name: checkout rust-fs-core (sibling path dep, and the output-budget wrapper)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: build
        # `--features cli` so the command-line tool (the `rust-img-vhd`
        # target, which requires it) is built, tested and linted on every
        # leg, not only in the `cli` job below.
        run: cargo build --locked --all-targets --features cli
      - name: test
        # QUIET BY DEFAULT: the whole run goes to tmp/logs/debug.log and is
        # uploaded below; this step prints a verdict line and the
        # executed-test count. A failure prints one line naming its status and
        # that log, which is uploaded below. See the
        # measured budget table at the top of chores.yml, and ../rust-fs-core/scripts/tier.sh.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it is
        # what makes every arithmetic test in this crate mean anything. The
        # variable tells `overflow_checks::the_build_the_gate_asked_to_check
        # _does_check` in src/lib.rs that THIS is the run that must trap an
        # overflow. It stays in the `env:` mapping rather than moving inline:
        # it is a fact about the run's environment, and one mapping states it
        # once. Do not add `--release` and do not drop the variable:
        # tests/ci_profile.rs reads this file and fails if no `cargo test` in
        # it runs without `--release` while setting it (#59).
        #
        # THE FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE. `cargo
        # test` exits 0 on "0 passed; 0 failed", so a filter that selects
        # nothing, a build that produced no test binaries, and a suite that
        # compiled itself away all report exactly the green a full run
        # reports -- and the empty run is also the one that fits its output
        # budget best, as a family-wide CI audit found. Measured on
        # 2026-09-17 from run 35176485318 (main, 2847b3a): 215 executed on
        # ubuntu-latest and macos-latest, 214 on windows-latest, over nine
        # binaries; this branch runs 254. The floor is 228, and it
        # moves up with the suite and never down.
        #
        # THE TRAP AND THE REDIRECTION ARE GONE because ../rust-fs-core/scripts/tier.sh does
        # both: it redirects rather than pipes, so the status stays cargo's,
        # and it names the log when the run fails. The whole log is kept and
        # uploaded rather than pasted into this one.
        #
        # `shell: bash` on every leg, because the tier scripts are bash and
        # the default shell on windows-latest is PowerShell.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (debug)" debug 400 27000 -- cargo test --locked --all-targets --features cli
          bash ../rust-fs-core/scripts/test-floor.sh debug 228
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: keep the tier log
        # `always()`, so the log survives the failure it exists to explain.
        # A failing tier prints one line naming this log rather than pasting
        # its end into the job output; THIS is what keeps the whole run once
        # the runner is gone, which the `trap` it replaces could not do, and
        # it is why the quiet failure loses nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-test-${{ matrix.os }}
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: clippy
        run: cargo clippy --locked --all-targets --features cli -- -D warnings

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE ANYTHING ABOVE TESTS.
  #
  # Every `cargo test` in this repository ran in the debug profile until
  # #85: the three matrix legs above, the `qemu-validation` job below,
  # and both suites in `release.yml`. What is published is built with
  # `[profile.release]` -- `lto = true`, `codegen-units = 1`,
  # `opt-level = 3`, `panic = "unwind"` -- and no run in the repository
  # ever compiled it. A defect that only appears under optimisation had
  # no job in which it could be seen before the crate went to crates.io.
  #
  # This is not a second copy of the matrix. The two profiles disagree
  # about behaviour in three ways, and all three hide defects rather
  # than invent them:
  #
  #   ARITHMETIC WRAPS INSTEAD OF PANICKING. `overflow-checks` is on in
  #   debug and off in release, which is the whole subject of the step
  #   above and of tests/ci_profile.rs. The consequence for THIS job is
  #   the mirror image: a test that guards a computation against
  #   overflow passes the debug run because the panic fires, and the
  #   wrapped -- wrong -- value it was guarding against is still what
  #   the shipped library computes. `rust-fs-ntfs` recorded exactly
  #   that: `signed_bytes_needed` negated `i64::MIN`, panicked in debug,
  #   wrapped in release, and the wrap happened to land on the right
  #   answer, so four tests ran in CI against a build in which they
  #   could not fail. Only a release run asks the question.
  #
  #   `debug_assert!` BODIES VANISH. Every invariant asserted that way
  #   is enforced on the runs above and unchecked in the artefact. A
  #   release run does not re-check those invariants -- nothing can, the
  #   code is gone -- but it does exercise the paths downstream of them
  #   with the assertions absent, which is the configuration a consumer
  #   links against and the one nothing here had ever executed.
  #
  #   `lto = true` AND `codegen-units = 1` CHANGE INLINING, and this
  #   crate is `crate-type = ["staticlib", "rlib"]` with a `#[unsafe(
  #   no_mangle)] extern "C"` surface in src/capi.rs. `panic = "unwind"`
  #   is load-bearing there: the C ABI entry points are where an unwind
  #   must not cross, and cross-crate inlining under LTO is what moves
  #   the code that can panic relative to the boundary that catches it.
  #   The debug profile links none of that the same way.
  #
  # ONE RUNNER RATHER THAN THE MATRIX. Profile behaviour is a property
  # of the optimiser, not of the operating system, so three of these
  # would buy the same evidence three times and pay for it on every
  # pull request. The platform question is the matrix's, and it keeps
  # it.
  #
  # NO `EXPECT_OVERFLOW_CHECKS` HERE, DELIBERATELY. Overflow checks are
  # meant to be off in this profile -- that is the thing being tested --
  # and `overflow_checks::the_build_the_gate_asked_to_check_does_check`
  # in src/lib.rs would fail the moment a release run claimed to be the
  # checking one. The handshake belongs to the debug step above and to
  # nothing else. See #85 and the comment on that step.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout rust-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      # ONE CHECKOUT OF CORE, WHICH IS BOTH PINS AT ONCE NOW.
      #
      # It was two, for two reasons that wanted different versions. The PATH
      # DEPENDENCY needed at least v0.2.12, the first core with
      # `BlockDevice::set_len` that an allocation calls before writing past
      # the device's end (#99). The TOOLING needed at least v0.2.13, because
      # ../rust-fs-core/scripts/tier.sh resolves core's ../rust-fs-core/scripts/output-budget.sh
      # (rust-fs-core#153 — deliberately not committed here) and v0.2.13 is
      # where a failing tier stopped reading its log aloud.
      #
      # The dependency is on v0.2.14 now, so the lower bound is met by the
      # higher pin and the second checkout has nothing left to do. The
      # comment it carried said exactly this would happen.
      - name: checkout rust-fs-core (sibling path dep, and the output-budget wrapper)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: test --release
        # ITS OWN TIER AND ITS OWN NUMBER, NOT THE MATRIX'S. It builds the
        # same targets today and counts roughly the same number, but it is a
        # different `cargo test` in a different profile: a release-only
        # build failure, a `#[cfg(debug_assertions)]` that takes a module out
        # of the release build, or a future narrowing of this command empties
        # this run without touching the matrix, and a floor shared with it
        # would be satisfied by the other job while proving nothing at all
        # about this one.
        #
        # Measured on 2026-09-18 from run 35292775981: 215 executed; this
        # branch runs 254, and the floor is 228 -- the same number
        # as the matrix, checked separately because nothing makes them stay
        # equal.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (release)" release 400 27000 -- cargo test --locked --release --all-targets --features cli
          bash ../rust-fs-core/scripts/test-floor.sh release 228
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout rust-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      # ONE CHECKOUT OF CORE, WHICH IS BOTH PINS AT ONCE NOW.
      #
      # It was two, for two reasons that wanted different versions. The PATH
      # DEPENDENCY needed at least v0.2.12, the first core with
      # `BlockDevice::set_len` that an allocation calls before writing past
      # the device's end (#99). The TOOLING needed at least v0.2.13, because
      # ../rust-fs-core/scripts/tier.sh resolves core's ../rust-fs-core/scripts/output-budget.sh
      # (rust-fs-core#153 — deliberately not committed here) and v0.2.13 is
      # where a failing tier stopped reading its log aloud.
      #
      # The dependency is on v0.2.14 now, so the lower bound is met by the
      # higher pin and the second checkout has nothing left to do. The
      # comment it carried said exactly this would happen.
      - name: checkout rust-fs-core (sibling path dep, and the output-budget wrapper)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: qemu cross-validation tests
        # A FLOOR, AND ITS OWN, BECAUSE THIS RUN SELECTS BY NAME.
        # `--test qemu_validation` names one integration target, and
        # `--features qemu-validation` is what makes the bodies in it compile
        # to anything: the `test` legs build the same file with the feature
        # off and run 0 tests out of it. So a renamed target, a renamed
        # feature, or a `#[cfg(feature = ...)]` that stops matching leaves
        # this job exiting 0 having cross-validated nothing, and the floor on
        # the `test` legs cannot see it -- their own count would not move by
        # one.
        #
        # Measured on 2026-09-17 from run 35176485318 (main, 2847b3a): 12
        # executed. The floor is 10: small enough that removing a case is not
        # a CI failure, and still an assertion that the suite ran rather than
        # evaporated.
        #
        # THE JOB ITSELF IS GUARDED NOW TOO.
        # `the_pr_gate_still_cross_validates_against_qemu_img` in
        # tests/ci_profile.rs reads this file and fails unless a gating job
        # named `qemu-validation` installs `qemu-utils` and runs `--features
        # qemu-validation --test qemu_validation`. Before it, deleting this
        # whole job left every test in the repository green -- the floor goes
        # with the step it lives in (#91).
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh qemu-validation qemu 120 9000 -- cargo test --locked --features qemu-validation --test qemu_validation
          bash ../rust-fs-core/scripts/test-floor.sh qemu 10
      # LINTED WHERE IT IS BUILT, AND ONLY HERE CAN IT BE.
      #
      # `cargo clippy --all-targets` in the other jobs compiles this file with
      # the feature OFF, so every qemu-img call and assertion in it is
      # cfg-ed away and clippy sees an empty file. `-D warnings` is enforced
      # on every other target in this repository and was not enforced on the
      # crate's only independent oracle.
      #
      # This step and the `required-features` entry in Cargo.toml go together:
      # with the entry and without this, the file would be neither run nor
      # linted by anything except the one `cargo test` above.
      - name: clippy (qemu cross-validation tests)
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-qemu
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      # `cargo doc` RESOLVES THE PATH DEPENDENCY, even though `cargo fmt`
      # does not -- so this job needs core checked out and did not before the
      # docs step below was added. Same ref as every other job.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        working-directory: rust-img-vhd
        run: cargo fmt --check
      # THE PUBLIC DOCS BUILD, AND A BROKEN LINK IS AN ERROR.
      #
      # Nothing here built the docs, and `build`, `test` and `clippy` all
      # ignore intra-doc links, so a link to a private item or to something
      # renamed away was invisible to every gate. Found by running it by hand:
      # five errors on `main`, including `<file>`/`<offset>`/`<len>` in
      # the since-retired `vhd_tool`'s usage block, read as unclosed HTML
      # tags.
      #
      # `-D warnings` specifically. rustdoc's default is to warn and carry on,
      # which is how the page ships with the text un-linked and no failure
      # anywhere -- and the errors mask each other, so the count grows as the
      # first ones are fixed. The sibling rust-img-qcow2 reached eight this
      # way (qcow2#105).
      - name: cargo doc (public docs build, broken links are errors)
        working-directory: rust-img-vhd
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: the one required check stands for every job
        working-directory: rust-img-vhd
        run: bash ../rust-fs-core/scripts/ci-gate.sh
      - name: the agent guide carries the shared block
        working-directory: rust-img-vhd
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: bash ../rust-fs-core/scripts/agents-core-check.sh
      # EVERY tests/scripts GUARD, BY GLOB (#123). They were named one step
      # each, so a guard added to that directory never ran until someone also
      # added a step here -- test-write-jobs-pinned.sh went green on its first
      # pull request without having run. Every guard runs even after one fails,
      # and the floor makes a glob that matched nothing a failure, not a pass.
      # tests/ci_profile.rs holds this loop and its floor in place.
      - name: script tests (tests/scripts/*.sh, by glob)
        working-directory: rust-img-vhd
        shell: bash
        run: |
          set -uo pipefail
          ran=0; failed=0
          for t in tests/scripts/*.sh; do
            [ -f "$t" ] || continue
            echo "== $t"
            bash "$t" || failed=$((failed + 1))
            ran=$((ran + 1))
          done
          # 2 since #134 deleted test-package-cli.sh with the script it
          # tested: the packaging and its tests are rust-fs-core's now.
          floor=2
          echo "ran $ran script tests, $failed failed (floor $floor)"
          [ "$failed" -eq 0 ] || exit 1
          [ "$ran" -ge "$floor" ] || { echo "::error::ran $ran script tests, floor is $floor"; exit 1; }
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        working-directory: rust-img-vhd
        shell: bash
        run: bash ../rust-fs-core/scripts/family-check.sh

  # THE COMMAND-LINE TOOL AS INSTALLED, found on PATH rather than as a
  # cargo target: `scripts/cli-install.sh` builds it in release mode and
  # stages it as an install prefix (the real `rust-img-vhd` and `img.vhd`
  # a relative symlink to it), then `scripts/test-cli.sh` runs
  # `rust-img-vhd doctor` first and every tests/cli/test-*.sh after it.
  # A change that breaks the tool fails the pull request, not the release.
  #
  # The oracle is qemu-img on the runner, as in `qemu-validation`: no VM.
  # The scripts are run directly rather than through `chore cli:install` and
  # `chore test:cli`, for the reason the `fmt` job gives -- CI here does not
  # install chore -- and chores.yml runs the same two commands with the
  # same budget and floor, which tests/ci_profile.rs holds the two files to.
  cli:
    name: cli (the installed tool, on PATH)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout rust-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout rust-fs-core (sibling path dep, and the output-budget wrapper)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - name: install qemu-utils, jq and man
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils jq man-db
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: build and stage the tool (chore cli:install)
        run: scripts/cli-install.sh
      - name: the staged tool first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: the cli tier (chore test:cli)
        # Measured on 2026-09-29 on the Mac: 32 lines, 1,026 bytes, 287
        # checks executed (134 with the read verbs, 259 with write and
        # create, then the man pages and completions). The budget leaves
        # room for the runner's longer paths, which appear in the doctor and
        # PATH lines; the floor is about 95% of the count, and moves up with
        # the suite.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (cli)" cli 40 1500 -- bash scripts/test-cli.sh
          bash ../rust-fs-core/scripts/test-floor.sh cli 272
      # THE RELEASE TARBALL, PUT TOGETHER ON EVERY PULL REQUEST, so a release
      # is not the first time it is. rust-fs-core's package-cli (run as
      # ../rust-fs-core/scripts/package-cli.sh) is what release.yml reaches through
      # core's release-cli workflow (#134): it lays out the install prefix
      # Cargo.toml's [package.metadata.package-cli] declares from the binary
      # just built and checks the unpacked result -- every member, each
      # dotted name a relative symlink to bin/rust-img-vhd, every man page
      # and completion, CAVEATS at most four lines, every name's --version.
      - name: the release tarball, built and its layout checked
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p tmp/package
          cd tmp/package
          bash ../../../rust-fs-core/scripts/package-cli.sh "$version" linux-x86_64 ../../target/release
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-cli
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#90).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system
  # from the file that produces them. Rename a job and the required
  # check is a name nothing reports — permanently pending, nothing
  # merges, no failure to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a
  # job that passed, and an aggregate that only ran when its needs
  # succeeded would be skipped itself — and a skipped required check
  # never reports at all.
  semver:
    # `chore check:semver`, spelled out because CI here does not install chore: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # ../rust-fs-core/scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version ../rust-fs-core/scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: semver (quiet, budgeted)
        working-directory: rust-img-vhd
        shell: bash
        run: bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh

  ci-ok:
    name: ci-ok
    needs: [test, test-release, qemu-validation, fmt, cli, semver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # EVERY job in `needs`, read from `needs` itself. This step once
      # echoed and looped over a hand-kept list that left out `semver`, so a
      # public-API break failed its own job and ci-ok still went green. A
      # job added to `needs:` is now judged without editing this step.
      - name: every gating job must have concluded success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
              echo "::error::not 'success': $bad -- failure, cancellation and skipping all mean the gate did not run to completion"
              exit 1
          fi
          echo "all gating jobs succeeded"
