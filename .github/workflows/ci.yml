name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it
        # is what makes every arithmetic test in this crate mean anything.
        #
        # The variable tells `overflow_checks::the_build_the_gate_asked_to
        # _check_does_check` in src/lib.rs that THIS is the run that must
        # trap an overflow -- asking the build directly rather than
        # inferring it from which spellings of "disabled" happen to be
        # absent from Cargo.toml. It is declared as an `env:` mapping
        # rather than inline as `VAR=1 cargo test` because this job also
        # runs on windows-latest, where that prefix is a PowerShell
        # syntax error.
        #
        # Do not add `--release` to this run, and do not drop the
        # variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting this.
        # See #59.
        #
        # `shell: bash` because the floor below is a shell script and the
        # default shell on the windows-latest leg is PowerShell, where
        # `$(...)`, `[ ... ]` and `trap` do not mean what they mean here.
        # The handshake stays in the `env:` mapping rather than moving
        # inline now that bash runs on every leg: it is a fact about the
        # run's environment, and one mapping states it once.
        shell: bash
        run: |
          # A FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE.
          # `cargo test` exits 0 on "0 passed; 0 failed", so a filter that
          # selects nothing, a build that produced no test binaries, and a
          # suite that compiled itself away all report exactly the green a
          # full run reports. Nothing above reads the number, so only a
          # count can tell them apart. See antimatter-studios/diskjockey#197.
          #
          # Measured on 2026-09-17 from run 35176485318 (main, 2847b3a):
          # 215 tests executed on ubuntu-latest and macos-latest and 214 on
          # windows-latest, over nine binaries. The floor is 200 -- below
          # the smallest of those by enough that deleting a test is not a
          # CI failure, and far above the empty run it exists to catch. It
          # moves up with the suite and never down.
          #
          # THE OUTPUT GOES TO A FILE AND IS PRINTED BY THE TRAP RATHER
          # THAN PIPED THROUGH `tee`. tests/ci_profile.rs refuses to count
          # a `cargo test` whose exit status a pipe discards, and it is
          # right to: Actions runs a `run:` block without `pipefail` by
          # default, so a pipeline's status is `tee`'s and a red suite
          # would leave this step green. Piping here would fail both
          # workflow assertions in that file, which is the guard working.
          # The trap prints the log on the way out either way -- including
          # when the suite failed and `errexit` ended the step at that line.
          trap 'cat "$RUNNER_TEMP/test.log"' EXIT
          cargo test --locked --all-targets > "$RUNNER_TEMP/test.log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 200)"
          if [ "$n" -lt 200 ]; then
              echo "::error::only $n tests executed, floor is 200 -- 214 to 215 ran on 2026-09-17 in run 35176485318, and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE ANYTHING ABOVE TESTS.
  #
  # Every `cargo test` in this repository ran in the debug profile until
  # #85: the three matrix legs above, the `qemu-validation` job below,
  # and both suites in `release.yml`. What is published is built with
  # `[profile.release]` -- `lto = true`, `codegen-units = 1`,
  # `opt-level = 3`, `panic = "unwind"` -- and no run in the repository
  # ever compiled it. A defect that only appears under optimisation had
  # no job in which it could be seen before the crate went to crates.io.
  #
  # This is not a second copy of the matrix. The two profiles disagree
  # about behaviour in three ways, and all three hide defects rather
  # than invent them:
  #
  #   ARITHMETIC WRAPS INSTEAD OF PANICKING. `overflow-checks` is on in
  #   debug and off in release, which is the whole subject of the step
  #   above and of tests/ci_profile.rs. The consequence for THIS job is
  #   the mirror image: a test that guards a computation against
  #   overflow passes the debug run because the panic fires, and the
  #   wrapped -- wrong -- value it was guarding against is still what
  #   the shipped library computes. `rust-fs-ntfs` recorded exactly
  #   that: `signed_bytes_needed` negated `i64::MIN`, panicked in debug,
  #   wrapped in release, and the wrap happened to land on the right
  #   answer, so four tests ran in CI against a build in which they
  #   could not fail. Only a release run asks the question.
  #
  #   `debug_assert!` BODIES VANISH. Every invariant asserted that way
  #   is enforced on the runs above and unchecked in the artefact. A
  #   release run does not re-check those invariants -- nothing can, the
  #   code is gone -- but it does exercise the paths downstream of them
  #   with the assertions absent, which is the configuration a consumer
  #   links against and the one nothing here had ever executed.
  #
  #   `lto = true` AND `codegen-units = 1` CHANGE INLINING, and this
  #   crate is `crate-type = ["staticlib", "rlib"]` with a `#[unsafe(
  #   no_mangle)] extern "C"` surface in src/capi.rs. `panic = "unwind"`
  #   is load-bearing there: the C ABI entry points are where an unwind
  #   must not cross, and cross-crate inlining under LTO is what moves
  #   the code that can panic relative to the boundary that catches it.
  #   The debug profile links none of that the same way.
  #
  # ONE RUNNER RATHER THAN THE MATRIX. Profile behaviour is a property
  # of the optimiser, not of the operating system, so three of these
  # would buy the same evidence three times and pay for it on every
  # pull request. The platform question is the matrix's, and it keeps
  # it.
  #
  # NO `EXPECT_OVERFLOW_CHECKS` HERE, DELIBERATELY. Overflow checks are
  # meant to be off in this profile -- that is the thing being tested --
  # and `overflow_checks::the_build_the_gate_asked_to_check_does_check`
  # in src/lib.rs would fail the moment a release run claimed to be the
  # checking one. The handshake belongs to the debug step above and to
  # nothing else. See #85 and the comment on that step.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: test --release
        run: |
          # ITS OWN FLOOR, NOT THE MATRIX'S, BECAUSE THIS IS A SEPARATE
          # RUN SELECTION. It builds the same targets today and counts
          # roughly the same number, but it is a different `cargo test`
          # in a different profile, and the ways it can empty out are
          # its own: a release-only build failure, a
          # `#[cfg(debug_assertions)]` that takes a module out of this
          # build alone, or a future narrowing of this command. Any of
          # those leaves the matrix above untouched and fully green, so
          # a floor shared with it would be satisfied by the other job
          # while proving nothing at all about this one. See the floor
          # in the `test` job for why a green `cargo test` is not
          # evidence on its own -- it exits 0 on "0 passed; 0 failed",
          # which is antimatter-studios/diskjockey#197.
          #
          # Measured on 2026-09-18 from run 35292775981 (PR #88,
          # 9ac9a57): 215 tests executed in the release profile, over
          # nine binaries -- the same 215 the ubuntu-latest debug leg
          # ran that day, which is the point: the count matches and the
          # profile does not. The floor is 190, roughly a tenth below,
          # so deleting a test is not a CI failure and an emptied run
          # still cannot pass. It moves up with the suite and never
          # down.
          #
          # THE OUTPUT GOES TO A FILE AND IS PRINTED BY THE TRAP RATHER
          # THAN PIPED THROUGH `tee`, for the reason spelled out on the
          # `test` job: Actions runs a `run:` block without `pipefail`,
          # so a pipeline hands this step `tee`'s exit status and a red
          # suite would report green. tests/ci_profile.rs refuses to
          # count a `cargo test` whose status a pipe discards, and the
          # trap prints the log on the way out either way -- including
          # when errexit ended the step at the `cargo test` line.
          trap 'cat "$RUNNER_TEMP/test-release.log"' EXIT
          cargo test --locked --release --all-targets > "$RUNNER_TEMP/test-release.log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/test-release.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 190)"
          if [ "$n" -lt 190 ]; then
              echo "::error::only $n release-profile tests executed, floor is 190 -- 215 ran on 2026-09-18 in run 35292775981, and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: qemu cross-validation tests
        run: |
          # A FLOOR, AND ITS OWN, BECAUSE THIS RUN SELECTS BY NAME.
          # `--test qemu_validation` names one integration target, and
          # `--features qemu-validation` is what makes the bodies in it
          # compile to anything: the `test` legs build the same file with
          # the feature off and run 0 tests out of it. So a renamed target,
          # a renamed feature, or a `#[cfg(feature = ...)]` that stops
          # matching leaves this job exiting 0 having cross-validated
          # nothing, and the floor on the `test` legs cannot see it --
          # their own count would not move by one.
          #
          # Measured on 2026-09-17 from run 35176485318 (main, 2847b3a):
          # 12 tests executed. The floor is 10: small enough that removing
          # a case is not a CI failure, and still an assertion that the
          # suite ran rather than evaporated.
          #
          # Redirected and printed by the trap rather than piped through
          # `tee`, for the same reason as the `test` job above: a pipe
          # would hand this step `tee`'s exit status instead of the
          # suite's, and Actions runs this block without `pipefail`.
          trap 'cat "$RUNNER_TEMP/qemu-validation.log"' EXIT
          cargo test --locked --features qemu-validation --test qemu_validation > "$RUNNER_TEMP/qemu-validation.log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/qemu-validation.log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 10)"
          if [ "$n" -lt 10 ]; then
              echo "::error::only $n qemu cross-validation tests executed, floor is 10 -- 12 ran on 2026-09-17 in run 35176485318, and a run that executes fewer than that stopped early rather than passed"
              exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#90).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system
  # from the file that produces them. Rename a job and the required
  # check is a name nothing reports — permanently pending, nothing
  # merges, no failure to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a
  # job that passed, and an aggregate that only ran when its needs
  # succeeded would be skipped itself — and a skipped required check
  # never reports at all.
  ci-ok:
    name: ci-ok
    needs: [test, test-release, qemu-validation, fmt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "test-release: ${{ needs.test-release.result }}"
          echo "qemu-validation: ${{ needs.qemu-validation.result }}"
          echo "fmt: ${{ needs.fmt.result }}"
          failed=0
          for one in "test:${{ needs.test.result }}" \
                     "test-release:${{ needs.test-release.result }}" \
                     "qemu-validation:${{ needs.qemu-validation.result }}" \
                     "fmt:${{ needs.fmt.result }}"; do
              job=${one%%:*}
              result=${one#*:}
              if [ "$result" != "success" ]; then
                  echo "::error::$job concluded '$result', not 'success' -- failure, cancellation and skipping all mean the gate did not run to completion"
                  failed=1
              fi
          done
          [ "$failed" = 0 ] || exit 1
          echo "all gating jobs succeeded"
