name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: build
        run: cargo build --locked --all-targets
      - name: test
        # QUIET BY DEFAULT: the whole run goes to tmp/logs/debug.log and is
        # uploaded below; this step prints a verdict line and the
        # executed-test count. A failure prints the tail of the log. See the
        # measured budget table at the top of chores.yml, and scripts/tier.sh.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it is
        # what makes every arithmetic test in this crate mean anything. The
        # variable tells `overflow_checks::the_build_the_gate_asked_to_check
        # _does_check` in src/lib.rs that THIS is the run that must trap an
        # overflow. It stays in the `env:` mapping rather than moving inline:
        # it is a fact about the run's environment, and one mapping states it
        # once. Do not add `--release` and do not drop the variable:
        # tests/ci_profile.rs reads this file and fails if no `cargo test` in
        # it runs without `--release` while setting it (#59).
        #
        # THE FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE. `cargo
        # test` exits 0 on "0 passed; 0 failed", so a filter that selects
        # nothing, a build that produced no test binaries, and a suite that
        # compiled itself away all report exactly the green a full run
        # reports -- and the empty run is also the one that fits its output
        # budget best. See antimatter-studios/diskjockey#197. Measured on
        # 2026-09-17 from run 35176485318 (main, 2847b3a): 215 executed on
        # ubuntu-latest and macos-latest, 214 on windows-latest, over nine
        # binaries; this branch runs 254. The floor is 228, and it
        # moves up with the suite and never down.
        #
        # THE TRAP AND THE REDIRECTION ARE GONE because scripts/tier.sh does
        # both: it redirects rather than pipes, so the status stays cargo's,
        # and it prints the tail when the run fails. The whole log is kept
        # and uploaded rather than pasted into this one.
        #
        # `shell: bash` on every leg, because the tier scripts are bash and
        # the default shell on windows-latest is PowerShell.
        shell: bash
        run: |
          bash scripts/tier.sh "test (debug)" debug 400 27000 -- cargo test --locked --all-targets
          bash scripts/test-floor.sh debug 228
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: keep the tier log
        # `always()`, so the log survives the failure it exists to explain.
        # A failing tier already prints its tail into this job log; this is
        # what keeps the WHOLE run once the runner is gone, which the `trap`
        # it replaces could not do.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-test-${{ matrix.os }}
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE ANYTHING ABOVE TESTS.
  #
  # Every `cargo test` in this repository ran in the debug profile until
  # #85: the three matrix legs above, the `qemu-validation` job below,
  # and both suites in `release.yml`. What is published is built with
  # `[profile.release]` -- `lto = true`, `codegen-units = 1`,
  # `opt-level = 3`, `panic = "unwind"` -- and no run in the repository
  # ever compiled it. A defect that only appears under optimisation had
  # no job in which it could be seen before the crate went to crates.io.
  #
  # This is not a second copy of the matrix. The two profiles disagree
  # about behaviour in three ways, and all three hide defects rather
  # than invent them:
  #
  #   ARITHMETIC WRAPS INSTEAD OF PANICKING. `overflow-checks` is on in
  #   debug and off in release, which is the whole subject of the step
  #   above and of tests/ci_profile.rs. The consequence for THIS job is
  #   the mirror image: a test that guards a computation against
  #   overflow passes the debug run because the panic fires, and the
  #   wrapped -- wrong -- value it was guarding against is still what
  #   the shipped library computes. `rust-fs-ntfs` recorded exactly
  #   that: `signed_bytes_needed` negated `i64::MIN`, panicked in debug,
  #   wrapped in release, and the wrap happened to land on the right
  #   answer, so four tests ran in CI against a build in which they
  #   could not fail. Only a release run asks the question.
  #
  #   `debug_assert!` BODIES VANISH. Every invariant asserted that way
  #   is enforced on the runs above and unchecked in the artefact. A
  #   release run does not re-check those invariants -- nothing can, the
  #   code is gone -- but it does exercise the paths downstream of them
  #   with the assertions absent, which is the configuration a consumer
  #   links against and the one nothing here had ever executed.
  #
  #   `lto = true` AND `codegen-units = 1` CHANGE INLINING, and this
  #   crate is `crate-type = ["staticlib", "rlib"]` with a `#[unsafe(
  #   no_mangle)] extern "C"` surface in src/capi.rs. `panic = "unwind"`
  #   is load-bearing there: the C ABI entry points are where an unwind
  #   must not cross, and cross-crate inlining under LTO is what moves
  #   the code that can panic relative to the boundary that catches it.
  #   The debug profile links none of that the same way.
  #
  # ONE RUNNER RATHER THAN THE MATRIX. Profile behaviour is a property
  # of the optimiser, not of the operating system, so three of these
  # would buy the same evidence three times and pay for it on every
  # pull request. The platform question is the matrix's, and it keeps
  # it.
  #
  # NO `EXPECT_OVERFLOW_CHECKS` HERE, DELIBERATELY. Overflow checks are
  # meant to be off in this profile -- that is the thing being tested --
  # and `overflow_checks::the_build_the_gate_asked_to_check_does_check`
  # in src/lib.rs would fail the moment a release run claimed to be the
  # checking one. The handshake belongs to the debug step above and to
  # nothing else. See #85 and the comment on that step.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: test --release
        # ITS OWN TIER AND ITS OWN NUMBER, NOT THE MATRIX'S. It builds the
        # same targets today and counts roughly the same number, but it is a
        # different `cargo test` in a different profile: a release-only
        # build failure, a `#[cfg(debug_assertions)]` that takes a module out
        # of the release build, or a future narrowing of this command empties
        # this run without touching the matrix, and a floor shared with it
        # would be satisfied by the other job while proving nothing at all
        # about this one.
        #
        # Measured on 2026-09-18 from run 35292775981: 215 executed; this
        # branch runs 254, and the floor is 228 -- the same number
        # as the matrix, checked separately because nothing makes them stay
        # equal.
        shell: bash
        run: |
          bash scripts/tier.sh "test (release)" release 400 27000 -- cargo test --locked --release --all-targets
          bash scripts/test-floor.sh release 228
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vhd
    steps:
      - name: checkout am-img-vhd
        uses: actions/checkout@v4
        with:
          path: rust-img-vhd
      - name: checkout am-fs-core (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vhd
      - name: qemu cross-validation tests
        # A FLOOR, AND ITS OWN, BECAUSE THIS RUN SELECTS BY NAME.
        # `--test qemu_validation` names one integration target, and
        # `--features qemu-validation` is what makes the bodies in it compile
        # to anything: the `test` legs build the same file with the feature
        # off and run 0 tests out of it. So a renamed target, a renamed
        # feature, or a `#[cfg(feature = ...)]` that stops matching leaves
        # this job exiting 0 having cross-validated nothing, and the floor on
        # the `test` legs cannot see it -- their own count would not move by
        # one.
        #
        # Measured on 2026-09-17 from run 35176485318 (main, 2847b3a): 12
        # executed. The floor is 10: small enough that removing a case is not
        # a CI failure, and still an assertion that the suite ran rather than
        # evaporated.
        #
        # THE JOB ITSELF IS GUARDED NOW TOO.
        # `the_pr_gate_still_cross_validates_against_qemu_img` in
        # tests/ci_profile.rs reads this file and fails unless a gating job
        # named `qemu-validation` installs `qemu-utils` and runs `--features
        # qemu-validation --test qemu_validation`. Before it, deleting this
        # whole job left every test in the repository green -- the floor goes
        # with the step it lives in (#91).
        shell: bash
        run: |
          bash scripts/tier.sh qemu-validation qemu 120 9000 -- cargo test --locked --features qemu-validation --test qemu_validation
          bash scripts/test-floor.sh qemu 10
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-qemu
          path: rust-img-vhd/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --check
      - name: the agent guide carries the shared block
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: scripts/agents-core-check.sh

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#90).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system
  # from the file that produces them. Rename a job and the required
  # check is a name nothing reports — permanently pending, nothing
  # merges, no failure to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a
  # job that passed, and an aggregate that only ran when its needs
  # succeeded would be skipped itself — and a skipped required check
  # never reports at all.
  ci-ok:
    name: ci-ok
    needs: [test, test-release, qemu-validation, fmt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "test-release: ${{ needs.test-release.result }}"
          echo "qemu-validation: ${{ needs.qemu-validation.result }}"
          echo "fmt: ${{ needs.fmt.result }}"
          failed=0
          for one in "test:${{ needs.test.result }}" \
                     "test-release:${{ needs.test-release.result }}" \
                     "qemu-validation:${{ needs.qemu-validation.result }}" \
                     "fmt:${{ needs.fmt.result }}"; do
              job=${one%%:*}
              result=${one#*:}
              if [ "$result" != "success" ]; then
                  echo "::error::$job concluded '$result', not 'success' -- failure, cancellation and skipping all mean the gate did not run to completion"
                  failed=1
              fi
          done
          [ "$failed" = 0 ] || exit 1
          echo "all gating jobs succeeded"
