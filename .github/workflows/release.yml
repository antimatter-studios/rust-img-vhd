name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # The suite runs through scripts/tier.sh, and tests/output_budget.rs runs
    # tier.sh itself, so this job needs the core checkout that carries the
    # output-budget wrapper. Relative to the repository, which is what
    # tier.sh resolves a relative FS_CORE_ROOT against.
    env:
      FS_CORE_ROOT: ../rust-fs-core-budget
    steps:
      - uses: actions/checkout@v5

      # THE COMPILE PIN. v0.2.12 is the first core with the `set_len` an
      # allocation calls before it grows the image -- see the note in
      # .github/workflows/ci.yml and #99 -- and it moves separately from the
      # tooling pin below.
      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.12 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      # THE TOOLING PIN. scripts/output-budget.sh is rust-fs-core's, is not
      # committed here (rust-fs-core#153), and ships from v0.2.11; v0.2.13 is
      # where a failing tier became quiet.
      - name: clone am-fs-core for the output-budget wrapper
        shell: bash
        run: git clone --depth 1 --branch v0.2.13 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core-budget

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Gates the release on the qemu-img cross-validation actually running.
  # The default `test` job runs with qemu-validation OFF, so the qemu
  # binary compiles to an empty shell and proves nothing. This job turns
  # the feature ON and runs the real cross-validation. qemu-img is
  # invoked as a subprocess only — never linked, never bundled.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: clone am-fs-core sibling
        shell: bash
        run: git clone --depth 1 --branch v0.2.12 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: qemu cross-validation tests
        run: cargo test --locked --features qemu-validation --test qemu_validation

  publish:
    name: publish to crates.io
    needs: [test, qemu-validation]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: clone am-fs-core sibling (path dep)
        shell: bash
        run: git clone --depth 1 --branch v0.2.12 https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: rust-lang/crates-io-auth-action@v1.0.4
        id: auth

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
